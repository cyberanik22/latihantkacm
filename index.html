Q(35,"literasi","Informasi tersurat","Pengumuman menyebut perpustakaan digital dapat diakses pukul 06.00–21.00 setiap hari, kecuali saat pemeliharaan. Pernyataan yang benar adalah …",["Layanan hanya tersedia malam hari","Layanan biasanya dapat diakses dalam rentang 06.00–21.00","Layanan selalu tersedia tanpa pemeliharaan","Layanan hanya buka pada hari sekolah"],1,"Pernyataan sesuai jadwal dan pengecualian yang disebutkan."),
Q(36,"literasi","Argumen","Siswa berpendapat bahwa sekolah perlu menyediakan tempat sampah elektronik karena baterai dan perangkat rusak tidak sebaiknya dicampur dengan sampah biasa. Alasan yang paling mendukung adalah …",["Wadah elektronik membuat lorong lebih berwarna","Komponen tertentu perlu penanganan khusus agar mengurangi risiko lingkungan","Sampah biasa lebih mudah dilihat","Semua perangkat terbuat dari bahan yang sama"],1,"Penanganan khusus membantu mengurangi risiko dari komponen elektronik."),
Q(37,"numerasi","Persentase","Dari 200 responden, 35% memilih materi keamanan jaringan sebagai pelatihan favorit. Berapa responden yang memilihnya?",["35","60","70","75"],2,"35% × 200 = 70 responden."),
Q(38,"numerasi","Data tabel","Penggunaan data tiga kelas: XII TJKT 1 = 24 GB, XII TJKT 2 = 31 GB, XII TJKT 3 = 25 GB. Kelas mana menggunakan data paling banyak?",["XII TJKT 1","XII TJKT 2","XII TJKT 3","Semuanya sama"],1,"31 GB adalah angka terbesar."),
Q(39,"numerasi","Rata-rata","Empat sesi praktik mencatat 8, 10, 12, dan 14 gangguan yang berhasil dianalisis. Rata-rata per sesi adalah …",["10","11","12","13"],1,"(8+10+12+14) ÷ 4 = 44 ÷ 4 = 11."),

Q(41,"fiber","Konsep dasar","Prinsip utama yang memungkinkan cahaya merambat di dalam inti fiber optik adalah …",["Induksi elektromagnetik pada tembaga","Pemantulan internal total pada kondisi yang sesuai","Aliran elektron pada inti kaca","Pemanasan cladding"],1,"Cahaya dapat dipandu oleh pemantulan internal total ketika kondisi indeks bias dan sudutnya sesuai."),
Q(42,"fiber","Jenis kabel","Untuk jalur telekomunikasi jarak jauh dengan kapasitas tinggi, pilihan yang umumnya sesuai adalah …",["Single-mode fiber","Kabel speaker","Multi-mode untuk semua jarak","Kabel listrik"],0,"Single-mode umum digunakan untuk jarak jauh karena dispersi modalnya lebih rendah."),
Q(43,"fiber","Komponen","Bagian fiber optik tempat cahaya terutama merambat disebut …",["Jacket","Core","Strength member","Outer duct"],1,"Core adalah inti optik tempat cahaya dipandu."),
Q(44,"fiber","Konektor","Sebelum menghubungkan konektor fiber ke perangkat ukur, tindakan yang paling tepat adalah …",["Melihat langsung ujung konektor dari dekat","Membersihkan dan memeriksa konektor dengan alat inspeksi yang sesuai","Menyentuh ujung ferrule dengan jari","Menggosoknya dengan kain kasar"],1,"Konektor harus diperiksa dan dibersihkan dengan alat yang sesuai; jangan melihat ujung fiber secara langsung."),
Q(45,"fiber","Perangkat","Perangkat yang umum digunakan untuk mengukur daya optik yang diterima pada jalur fiber adalah …",["Optical Power Meter","Fusion splicer","Switch PoE","Crimping tool"],0,"Optical Power Meter (OPM) mengukur daya optik, biasanya dalam dBm."),
Q(46,"fiber","Perangkat","Fusion splicer berfungsi untuk …",["Menyambungkan serat optik dengan peleburan ujung serat","Membagi sinyal optik ke banyak pelanggan","Mengukur panjang kabel tembaga","Mengubah alamat IP"],0,"Fusion splicer menyatukan serat optik dengan proses peleburan."),
Q(47,"fiber","Link budget","Pemancar mengeluarkan +3 dBm. Total rugi-rugi jalur adalah 7 dB. Daya terima idealnya adalah …",["+10 dBm","+4 dBm","−4 dBm","−10 dBm"],2,"Daya terima = daya pancar − total loss = +3 − 7 = −4 dBm."),
Q(48,"fiber","Redaman","Kabel mengalami redaman 0,35 dB/km sepanjang 10 km. Redaman kabel saja adalah …",["0,35 dB","1,5 dB","3,5 dB","35 dB"],2,"Redaman = 0,35 dB/km × 10 km = 3,5 dB, belum termasuk konektor dan sambungan."),

Q(50,"fiber","Troubleshooting","Kabel fiber tertekuk tajam di dekat tray dan daya optik menurun. Tindakan yang tepat adalah …",["Memastikan radius tekuk sesuai spesifikasi lalu mengukur ulang","Menekan kabel lebih kuat","Membuka konektor saat laser aktif dan melihat ujungnya","Memotong kabel tanpa pengukuran"],0,"Tekukan berlebihan dapat meningkatkan loss; perbaiki jalur sesuai batas radius tekuk dan ukur ulang.")
];

let student=null, view="login", activeCat=null, session=null, history=JSON.parse(localStorage.getItem("cyberlearn_history")||"[]"), learned=JSON.parse(localStorage.getItem("cyberlearn_learned")||"[]");
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2500);}
function persist(){localStorage.setItem("cyberlearn_student",JSON.stringify(student));localStorage.setItem("cyberlearn_history",JSON.stringify(history));localStorage.setItem("cyberlearn_learned",JSON.stringify(learned));}
function header(){return `<header class="topbar"><div class="brand"><div class="logo">C</div><div>CYBER LEARN<small>LEARN • PRACTICE • GROW</small></div></div><div class="user-area"><span class="user-label">${esc(student?.name||"")} · ${esc(student?.kelas||"")}</span><button class="logout" onclick="logout()">Keluar ↗</button></div></header>`}
function renderLogin(){view="login";$("#app").innerHTML=`<main class="login-wrap"><section class="login-side"><div class="brand"><div class="logo">C</div><div>CYBER LEARN<small>SMART EXAM PREPARATION</small></div></div><div><div class="eyebrow" style="color:#70dfff">SIAPKAN DIRI, SATU SOAL SEKALIGUS</div><h1>Belajar terarah.<br>Berpikir cerdas.</h1><p>Ruang latihan digital untuk persiapan TKA, pengenalan AN, dan kompetensi kejuruan fiber optik.</p></div><div class="bottom-note" style="color:#9fb1df;font-size:12px">SMK Cyber Media Jakarta · Kelas XII TJKT</div></section><section class="login-form-area"><form class="login-form" id="loginForm"><div class="eyebrow">SELAMAT DATANG</div><h2>Mulai perjalananmu</h2><p class="sub">Masuk dengan nama dan kelas untuk membuka dashboard belajar.</p><label class="field"><span>Nama lengkap</span><input id="studentName" required maxlength="80" placeholder="Masukkan nama lengkap" autocomplete="name"></label><label class="field"><span>Kelas</span><select id="studentClass" required><option value="">Pilih kelas</option><option>XII TJKT 1</option><option>XII TJKT 2</option><option>XII TJKT 3</option></select></label><button class="btn primary full" type="submit">Masuk ke Dashboard <span>→</span></button><div class="notice">Identitas ini hanya untuk pengalaman latihan pada perangkat ini. Login nama dan kelas bukan verifikasi identitas resmi.</div><p class="fine">Dengan masuk, kamu dapat berlatih dan menyimpan progres pada browser yang sama.</p></form></section></main>`;
$("#loginForm").addEventListener("submit",e=>{e.preventDefault();student={name:$("#studentName").value.trim(),kelas:$("#studentClass").value};if(!student.name||!student.kelas)return;persist();renderDashboard()});}
function renderDashboard(){view="dashboard";const attempts=history.filter(h=>h.student===student.name&&h.kelas===student.kelas);const answered=attempts.reduce((n,h)=>n+h.answered,0);const avg=attempts.length?Math.round(attempts.reduce((n,h)=>n+h.percent,0)/attempts.length):0;
$("#app").innerHTML=`${header()}<main class="container"><section class="hero"><div><div class="eyebrow">RUANG BELAJAR DIGITAL · XII TJKT</div><h1>Halo, ${esc(student.name.split(" ")[0])}. Siap naik level?</h1><p>Persiapkan dirimu sedikit demi sedikit. Pahami materi, latih kemampuan, lalu evaluasi hasil belajarmu.</p><button class="btn cyan" onclick="startQuiz(null,false)">Mulai Latihan <span>→</span></button> <button class="btn" style="background:#ffffff18;color:white;border:1px solid #ffffff40" onclick="renderMaterials()">Pelajari Fiber Optik</button></div><div class="hero-art">🎓</div></section>
<div class="stats"><div class="stat"><span class="icon">▦</span><div class="label">Bank soal latihan</div><strong>${questions.length}</strong><div class="label">soal unik tersedia</div></div><div class="stat"><span class="icon">✎</span><div class="label">Sesi latihan</div><strong>${attempts.length}</strong><div class="label">tersimpan di perangkat ini</div></div><div class="stat"><span class="icon">✓</span><div class="label">Soal terjawab</div><strong>${answered}</strong><div class="label">akumulasi sesi selesai</div></div><div class="stat"><span class="icon">↗</span><div class="label">Rata-rata nilai</div><strong>${avg}%</strong><div class="label">dari sesi selesai</div></div></div>
<div class="section-head"><div><div class="eyebrow">PILIH JALUR BELAJAR</div><h2>Kategori latihan</h2><p>Pilih kategori untuk berlatih lebih fokus.</p></div><button class="btn outline" onclick="startQuiz(null,true)">Simulasi 50 Soal ↗</button></div>
<div class="categories">${CATS.map(c=>`<button class="category" onclick="startQuiz('${c.id}',false)"><div class="cat-icon">${c.icon}</div><h3>${c.name}</h3><p>${c.desc}</p><div class="progress"><span style="width:${Math.min(100,Math.round(c.count/12*100))}%"></span></div><div class="cat-bottom"><span>${questions.filter(q=>q.cat===c.id).length} soal</span><span>Mulai latihan →</span></div></button>`).join("")}</div>

<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap"><div><strong>${learned.length} dari ${material.length} bab dipelajari</strong><div class="progress" style="width:min(400px,70vw)"><span style="width:${learned.length/material.length*100}%"></span></div></div><span style="font-size:28px">🔦</span></div></div>
<div class="footer">CYBER LEARN · Paket latihan sekolah, bukan aplikasi resmi Kemendikdasmen.</div></main>`}
function startQuiz(cat,mock){let qs=mock?[...questions]:questions.filter(q=>q.cat===cat);if(!qs.length){toast("Soal kategori belum tersedia.");return}session={cat,mock,qs:qs.map(q=>({...q})),index:0,answers:{},flagged:[],start:Date.now(),timeLimit:mock?90*60:Math.max(10,qs.length*2)*60,finished:false};view="quiz";renderQuiz()}
function renderQuiz(){view="quiz";const q=session.qs[session.index],answered=Object.hasOwn(session.answers,q.id),remain=Math.max(0,session.timeLimit-Math.floor((Date.now()-session.start)/1000));const mm=String(Math.floor(remain/60)).padStart(2,"0"),ss=String(remain%60).padStart(2,"0");
$("#app").innerHTML=`${header()}<main class="container"><div class="view-head"><div><div class="eyebrow">${session.mock?"SIMULASI LENGKAP":"MODE LATIHAN"}</div><h1>${session.mock?"Simulasi 50 Soal":CATS.find(c=>c.id===session.cat).name}</h1><p style="color:var(--muted);margin:0">${esc(student.name)} · ${esc(student.kelas)} · Soal ${session.index+1} dari ${session.qs.length}</p></div><div class="timer" id="timer">◷ ${mm}:${ss}</div></div><div class="quiz-layout"><section class="question-card"><div class="quiz-meta"><span>${esc(q.topic||"Latihan")}</span><span>${answered?"Jawaban tersimpan":"Pilih satu jawaban"}</span></div>${q.stimulus?`<div class="stimulus">${esc(q.stimulus)}</div>`:""}<h2>${esc(q.question)}</h2><div class="answers">${q.opts.map((o,i)=>`<div class="answer ${session.answers[q.id]===i?"selected":""}" role="button" tabindex="0" onclick="chooseAnswer(${q.id},${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();chooseAnswer(${q.id},${i})}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></div>`).join("")}</div><div class="quiz-actions"><button class="btn outline" ${session.index===0?"disabled":""} onclick="moveQuestion(-1)">← Sebelumnya</button><button class="btn light" onclick="toggleFlag()">${session.flagged.includes(q.id)?"◆ Ditandai":"◇ Tandai"}</button>${session.index===session.qs.length-1?`<button class="btn primary" onclick="confirmFinish()">Selesaikan</button>`:`<button class="btn primary" onclick="moveQuestion(1)">Berikutnya →</button>`}</div></section><aside class="panel quiz-sidebar"><p class="side-title">Navigasi soal</p><div class="number-grid">${session.qs.map((item,i)=>`<button class="num ${Object.hasOwn(session.answers,item.id)?"done":""} ${i===session.index?"current":""} ${session.flagged.includes(item.id)?"flagged":""}" onclick="goQuestion(${i})" aria-label="Soal ${i+1}">${i+1}</button>`).join("")}</div><div class="legend"><span><i class="dot green"></i>Sudah dijawab</span><span><i class="dot blue"></i>Soal aktif</span><span><i class="dot yellow"></i>Ditandai untuk ditinjau</span><span><i class="dot"></i>Belum dijawab</span></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:12px"><span>Progres jawaban</span><strong>${Object.keys(session.answers).length}/${session.qs.length}</strong></div><div class="progress"><span style="width:${Object.keys(session.answers).length/session.qs.length*100}%"></span></div><button class="btn outline full" style="margin-top:18px" onclick="confirmFinish()">Akhiri sesi</button></aside></div><p class="fine">Jawaban disimpan otomatis pada browser ini. Perpindahan tab tidak menghapus jawaban. Timer latihan kategori bersifat lokal; simulasi ini paket latihan sekolah, bukan format resmi ujian.</p></main>`;
startTimer();
}
let timerInterval=null;function startTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(()=>{if(view!=="quiz"||!session){clearInterval(timerInterval);return}const left=session.timeLimit-Math.floor((Date.now()-session.start)/1000);const t=$("#timer");if(t){const m=String(Math.max(0,Math.floor(left/60))).padStart(2,"0"),s=String(Math.max(0,left%60)).padStart(2,"0");t.textContent="◷ "+m+":"+s;if(left<=60)t.style.color="var(--red)"}if(left<=0){clearInterval(timerInterval);finishQuiz(true)}},1000)}
function chooseAnswer(id,i){session.answers[id]=i;renderQuiz()}
function moveQuestion(d){session.index=Math.max(0,Math.min(session.qs.length-1,session.index+d));renderQuiz()}
function goQuestion(i){session.index=i;renderQuiz()}
function toggleFlag(){const id=session.qs[session.index].id;session.flagged.includes(id)?session.flagged=session.flagged.filter(x=>x!==id):session.flagged.push(id);renderQuiz()}
function confirmFinish(){const unanswered=session.qs.length-Object.keys(session.answers).length;if(confirm(`Selesaikan sesi sekarang?\\n${unanswered} soal belum dijawab.`))finishQuiz(false)}
function finishQuiz(auto){if(timerInterval)clearInterval(timerInterval);const qs=session.qs,answered=Object.keys(session.answers).length,correct=qs.filter(q=>session.answers[q.id]===q.correct).length,percent=Math.round(correct/qs.length*100),record={student:student.name,kelas:student.kelas,cat:session.mock?"mock":session.cat,mock:session.mock,total:qs.length,answered,correct,percent,duration:Math.round((Date.now()-session.start)/1000),date:new Date().toISOString(),answers:{...session.answers},questionIds:qs.map(q=>q.id)};history.push(record);persist();view="result";$("#app").innerHTML=`${header()}<main class="container"><div class="view-head"><div><div class="eyebrow">SESI SELESAI ${auto?"· WAKTU HABIS":""}</div><h1>Hasil latihanmu</h1><p style="color:var(--muted)">Evaluasi hasil untuk menentukan langkah belajar berikutnya.</p></div><button class="btn outline" onclick="renderDashboard()">← Dashboard</button></div><section class="panel" style="text-align:center;padding:35px"><div style="font-size:45px">🎯</div><div class="result-score">${percent}</div><div style="color:var(--muted)">Nilai latihan dari 100</div><div class="result-grid"><div class="result-mini"><span class="label">Benar</span><strong style="color:var(--green)">${correct}</strong></div><div class="result-mini"><span class="label">Salah</span><strong style="color:var(--red)">${answered-correct}</strong></div><div class="result-mini"><span class="label">Kosong</span><strong>${qs.length-answered}</strong></div></div><p>${percent>=80?"Bagus! Pertahankan pemahaman dan coba tantangan berikutnya.":percent>=60?"Awal yang baik. Tinjau pembahasan pada soal yang belum tepat.":"Terus berlatih. Baca pembahasan dan pelajari kembali konsep dasarnya."}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn primary" onclick="reviewResults()">Lihat pembahasan</button><button class="btn light" onclick="retryWrong()">Ulangi soal yang salah</button><button class="btn outline" onclick="renderDashboard()">Kembali ke dashboard</button></div></section><p class="fine">Hasil ini merupakan umpan balik belajar dan tidak menjamin atau memprediksi nilai resmi TKA.</p></main>`;window.lastRecord=record}
function reviewResults(){const r=window.lastRecord;if(!r)return;const qs=questions.filter(q=>r.questionIds.includes(q.id));view="review";$("#app").innerHTML=`${header()}<main class="container"><div class="view-head"><div><div class="eyebrow">EVALUASI JAWABAN</div><h1>Pembahasan soal</h1></div><button class="btn outline" onclick="renderDashboard()">Dashboard</button></div>${qs.map((q,i)=>{const a=r.answers[q.id],ok=a===q.correct;return `<article class="panel" style="margin-bottom:13px"><div class="eyebrow">SOAL ${i+1} · ${esc(q.topic)}</div><h3>${esc(q.question)}</h3>${q.stimulus?`<p>${esc(q.stimulus)}</p>`:""}<p><strong>Jawabanmu:</strong> ${a===undefined?"Belum dijawab":esc(q.opts[a])}</p><p><strong>Jawaban benar:</strong> ${esc(q.opts[q.correct])} <span style="color:${ok?"var(--green)":"var(--red)"};font-weight:800">${ok?"✓ Tepat":"· Perlu dipelajari"}</span></p><div class="stimulus"><strong>Pembahasan:</strong> ${esc(q.explanation)}</div></article>`}).join("")}<button class="btn primary" onclick="renderDashboard()">Selesai meninjau</button></main>`}
function retryWrong(){const r=window.lastRecord;if(!r)return;const wrong=questions.filter(q=>r.questionIds.includes(q.id)&&r.answers[q.id]!==q.correct);if(!wrong.length){toast("Tidak ada jawaban salah untuk diulang.");return}session={cat:r.cat,mock:false,qs:wrong.map(q=>({...q})),index:0,answers:{},flagged:[],start:Date.now(),timeLimit:Math.max(600,wrong.length*120),finished:false};renderQuiz()}
function renderMaterials(){view="materials";$("#app").innerHTML=`${header()}<main class="container"><div class="view-head"><div><div class="eyebrow">PUSAT MATERI</div><h1>Belajar Fiber Optik</h1><p style="color:var(--muted);margin:0">Materi ringkas untuk memperkuat kompetensi kejuruan TJKT.</p></div><button class="btn outline" onclick="renderDashboard()">← Dashboard</button></div><div class="panel" style="margin-bottom:18px"><strong>Progres materi: ${learned.length}/${material.length} bab</strong><div class="progress"><span style="width:${learned.length/material.length*100}%"></span></div></div><div class="material-grid">${material.map(([n,title,body],i)=>`<article class="material" style="background:white"><div class="eyebrow">BAB ${n}</div><h3>${title}</h3><p>${body}</p><button class="btn ${learned.includes(n)?"light":"outline"}" style="margin-top:14px" onclick="toggleLearned('${n}')">${learned.includes(n)?"✓ Sudah dipelajari":"Tandai sudah dipelajari"}</button></article>`).join("")}</div><section class="panel" style="margin-top:18px"><h3>Siap menguji pemahaman?</h3><p style="color:var(--muted)">Kerjakan 10 soal Kompetensi Kejuruan TJKT — Fiber Optik.</p><button class="btn primary" onclick="startQuiz('fiber',false)">Mulai latihan fiber optik →</button></section></main>`}
function toggleLearned(n){learned.includes(n)?learned=learned.filter(x=>x!==n):learned.push(n);persist();renderMaterials()}
function logout(){if(confirm("Keluar dari sesi belajar?")){student=null;session=null;localStorage.removeItem("cyberlearn_student");renderLogin()}}
(function init(){const saved=localStorage.getItem("cyberlearn_student");if(saved){try{student=JSON.parse(saved);if(student.name&&["XII TJKT 1","XII TJKT 2","XII TJKT 3"].includes(student.kelas))renderDashboard();else renderLogin()}catch{renderLogin()}}else renderLogin()})();
</script>
</body>
</html>
